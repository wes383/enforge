# Test override: pins api / worker / test to the deterministic mock stack so the
# suite never depends on network access or consumes real API quota from .env.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     --profile test up -d --build api worker
#   docker compose -f docker-compose.yml -f docker-compose.test.yml \
#     --profile test run --rm test
#
# Restore the real configuration afterwards:
#   docker compose up -d --force-recreate api worker

x-offline-environment: &offline-environment
  RESEARCH_PROVIDER_MODE: "mock"
  TAVILY_ENABLED: "false"
  TAVILY_API_KEY: ""
  EXA_ENABLED: "false"
  EXA_API_KEY: ""
  FIRECRAWL_ENABLED: "false"
  FIRECRAWL_API_KEY: ""
  CROSSREF_ENABLED: "false"
  SEMANTIC_SCHOLAR_ENABLED: "false"
  SEMANTIC_SCHOLAR_API_KEY: ""
  OPENAI_API_KEY: ""
  RESEARCH_LLM_WRITING_ENABLED: "false"
  RESEARCH_LLM_OUTLINE_ENABLED: "false"
  RESEARCH_LLM_POLISH_ENABLED: "false"
  RESEARCH_CLAIM_LLM_REVIEW: "false"
  RESEARCH_AGENT_ENABLED: "false"
  RESEARCH_WRITE_SEARCH_MAX_REQUESTS_PER_SECTION: "2"
  RESEARCH_WRITE_SEARCH_MAX_SEARCHES: "2"
  RESEARCH_WRITE_SEARCH_MAX_SOURCES: "6"
  RESEARCH_WRITE_SEARCH_MAX_EVIDENCE: "6"
  LANGFUSE_ENABLED: "false"
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

services:
  api:
    environment: *offline-environment

  worker:
    environment: *offline-environment

  test:
    environment: *offline-environment
