name: enforge

x-app-environment: &app-environment
  APP_NAME: "${APP_NAME:-Deep Research Writing Agent}"
  APP_VERSION: "${APP_VERSION:-0.1.0}"
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-enforge}:${POSTGRES_PASSWORD:-enforge_dev_password}@postgres:5432/${POSTGRES_DB:-enforge}"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/1}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/2}"
  CELERY_TASK_DEFAULT_QUEUE: "${CELERY_TASK_DEFAULT_QUEUE:-research}"
  CELERY_PARSE_QUEUE: "${CELERY_PARSE_QUEUE:-parse}"
  RUN_TASK_MAX_RETRIES: "${RUN_TASK_MAX_RETRIES:-3}"
  RUN_TASK_SOFT_TIME_LIMIT_SECONDS: "${RUN_TASK_SOFT_TIME_LIMIT_SECONDS:-300}"
  RUN_TASK_HARD_TIME_LIMIT_SECONDS: "${RUN_TASK_HARD_TIME_LIMIT_SECONDS:-360}"
  SSE_POLL_INTERVAL_SECONDS: "${SSE_POLL_INTERVAL_SECONDS:-1.0}"
  SSE_KEEPALIVE_SECONDS: "${SSE_KEEPALIVE_SECONDS:-15.0}"
  FILE_STORAGE_ROOT: "${FILE_STORAGE_ROOT:-/app/data/files}"
  MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5242880}"
  TAVILY_ENABLED: "${TAVILY_ENABLED:-false}"
  TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
  EXA_ENABLED: "${EXA_ENABLED:-false}"
  EXA_API_KEY: "${EXA_API_KEY:-}"
  FIRECRAWL_ENABLED: "${FIRECRAWL_ENABLED:-false}"
  FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
  CROSSREF_ENABLED: "${CROSSREF_ENABLED:-false}"
  CROSSREF_MAILTO: "${CROSSREF_MAILTO:-}"
  SEMANTIC_SCHOLAR_ENABLED: "${SEMANTIC_SCHOLAR_ENABLED:-false}"
  SEMANTIC_SCHOLAR_API_KEY: "${SEMANTIC_SCHOLAR_API_KEY:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
  OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
  LLM_REQUEST_TIMEOUT_SECONDS: "${LLM_REQUEST_TIMEOUT_SECONDS:-120}"
  LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-0}"
  PROVIDER_REQUEST_TIMEOUT_SECONDS: "${PROVIDER_REQUEST_TIMEOUT_SECONDS:-20}"
  PROVIDER_CONNECT_TIMEOUT_SECONDS: "${PROVIDER_CONNECT_TIMEOUT_SECONDS:-5}"
  PROVIDER_MAX_RETRIES: "${PROVIDER_MAX_RETRIES:-3}"
  PROVIDER_RETRY_BACKOFF_SECONDS: "${PROVIDER_RETRY_BACKOFF_SECONDS:-0.5}"
  PROVIDER_CACHE_TTL_SECONDS: "${PROVIDER_CACHE_TTL_SECONDS:-900}"
  FIRECRAWL_MAX_CONCURRENCY: "${FIRECRAWL_MAX_CONCURRENCY:-2}"
  WEB_FETCH_MAX_BYTES: "${WEB_FETCH_MAX_BYTES:-2000000}"
  WEB_FETCH_MIN_CONTENT_CHARS: "${WEB_FETCH_MIN_CONTENT_CHARS:-400}"
  RESEARCH_PROVIDER_MODE: "${RESEARCH_PROVIDER_MODE:-auto}"
  RESEARCH_MAX_SEARCH_ROUNDS: "${RESEARCH_MAX_SEARCH_ROUNDS:-3}"
  RESEARCH_MAX_QUERIES_PER_ROUND: "${RESEARCH_MAX_QUERIES_PER_ROUND:-6}"
  RESEARCH_MAX_SOURCES: "${RESEARCH_MAX_SOURCES:-20}"
  RESEARCH_MAX_FETCHES_PER_ROUND: "${RESEARCH_MAX_FETCHES_PER_ROUND:-8}"
  RESEARCH_MAX_EVIDENCE: "${RESEARCH_MAX_EVIDENCE:-40}"
  RESEARCH_MAX_FETCH_CONCURRENCY: "${RESEARCH_MAX_FETCH_CONCURRENCY:-2}"
  RESEARCH_NODE_TIMEOUT_SECONDS: "${RESEARCH_NODE_TIMEOUT_SECONDS:-90}"
  RESEARCH_TOKEN_BUDGET: "${RESEARCH_TOKEN_BUDGET:-0}"
  RESEARCH_COST_BUDGET_USD: "${RESEARCH_COST_BUDGET_USD:-0}"
  RESEARCH_PLAN_APPROVAL_REQUIRED: "${RESEARCH_PLAN_APPROVAL_REQUIRED:-true}"
  RESEARCH_OUTLINE_APPROVAL_REQUIRED: "${RESEARCH_OUTLINE_APPROVAL_REQUIRED:-true}"
  RESEARCH_RETRIEVAL_MODE: "${RESEARCH_RETRIEVAL_MODE:-hybrid}"
  RESEARCH_RETRIEVAL_LIMIT: "${RESEARCH_RETRIEVAL_LIMIT:-10}"
  RESEARCH_CHUNK_MAX_CHARS: "${RESEARCH_CHUNK_MAX_CHARS:-1200}"
  RESEARCH_LLM_PLANNING_ENABLED: "${RESEARCH_LLM_PLANNING_ENABLED:-false}"
  RESEARCH_LLM_WRITING_ENABLED: "${RESEARCH_LLM_WRITING_ENABLED:-false}"
  RESEARCH_CLAIM_LLM_REVIEW: "${RESEARCH_CLAIM_LLM_REVIEW:-false}"
  RESEARCH_CLAIM_LLM_REVIEW_LIMIT: "${RESEARCH_CLAIM_LLM_REVIEW_LIMIT:-10}"
  MAX_ACTIVE_RUNS_PER_PROJECT: "${MAX_ACTIVE_RUNS_PER_PROJECT:-3}"
  LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
  LANGFUSE_HOST: "${LANGFUSE_HOST:-https://cloud.langfuse.com}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
  LANGFUSE_TIMEOUT_SECONDS: "${LANGFUSE_TIMEOUT_SECONDS:-5}"
  OBSERVABILITY_INCLUDE_CONTENT: "${OBSERVABILITY_INCLUDE_CONTENT:-false}"
  PARSER_MAX_INPUT_BYTES: "${PARSER_MAX_INPUT_BYTES:-5242880}"
  PARSER_MAX_OUTPUT_CHARS: "${PARSER_MAX_OUTPUT_CHARS:-2000000}"
  PARSER_MAX_PDF_PAGES: "${PARSER_MAX_PDF_PAGES:-200}"
  PARSE_TASK_SOFT_TIME_LIMIT_SECONDS: "${PARSE_TASK_SOFT_TIME_LIMIT_SECONDS:-240}"
  PARSE_TASK_HARD_TIME_LIMIT_SECONDS: "${PARSE_TASK_HARD_TIME_LIMIT_SECONDS:-300}"
  EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1536}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
  ENABLE_DEV_ENDPOINTS: "${ENABLE_DEV_ENDPOINTS:-true}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-enforge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-enforge_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-enforge}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - app_net

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *app-environment
    volumes:
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *app-environment
    volumes:
      - research_files:/app/data/files
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - app_net

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment: *app-environment
    volumes:
      - research_files:/app/data/files
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "-Q",
        "research,parse",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_net

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        INSTALL_DEV: "true"
    environment:
      <<: *app-environment
      FILE_STORAGE_ROOT: "/app/data/files"
      API_BASE_URL: "http://api:8000"
    volumes:
      - research_files:/app/data/files
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && pytest -q tests/unit tests/integration tests/evaluation",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      - app_net

volumes:
  research_files:
  postgres_data:
  redis_data:

networks:
  app_net:
    driver: bridge
